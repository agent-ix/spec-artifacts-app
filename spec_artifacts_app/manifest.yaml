    digest: sha256:91138f6c57477c5fa45532859f5dbc6de9195b9fb7287bd51cee221483fd8410
  defaults:
    id_pattern: MR-{next:03d}
  allowed_links:
  - aggregates
  - depends_on
  - references
  examples: []
  lint_rules_ref: []
  body_extraction:
    yield_pattern:
      match:
        title:
          from: heading
          level: 1
          required: true
          assert:
            level: 1
        purpose:
          from: section_body
          after_heading: Purpose
          required: true
          assert:
            level: 2
        scope:
          from: section_body
          after_heading: Scope
          required: false
          assert:
            level: 2
        system_overview:
          from: section_body
          after_heading: System Overview
          required: false
          assert:
            level: 2
        structure:
          from: section_body
          after_heading: Structure
          required: false
          assert:
            level: 2
        requirements_architecture:
          from: section_body
          after_heading: Requirements Architecture
          required: false
          assert:
            level: 2
        references:
          from: section_body
          after_heading: References
          required: false
          assert:
            level: 2
        requirements_table:
          from: table_row
          under_section: Requirements
          required: false
          assert:
            columns:
            - ID
            - Kind
            - Source
            - Target
            min_rows: 1
            id_column: ID
            id_pattern: ^(StR|US|FR|NFR|IT|TC)-\d+$
        properties_table:
          from: table_row
          under_section: Properties
          required: false
          assert:
            columns:
            - Field
            - Type
            - Multiplicity
            - Constraints
            min_rows: 1
        properties_fence:
          from: code_block
          language: sysml
          under_section: Properties
          required: false
          multiple: false
        invariants:
          from: code_block
          language: ocl
          under_section: Invariants
          required: false
          multiple: true
doc_kinds:
- application-spec
- master-requirements
object_types: []
lint_rules: []
