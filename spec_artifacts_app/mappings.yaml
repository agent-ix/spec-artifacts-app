# Markdown mapping declaration for spec-artifacts-app (FR-004).
#
# Markdown is the authority; the record is a derived projection. Every property
# of every exported model appears here exactly once, with the mapping kind that
# fills it, the Markdown form it reads, and whether that form round-trips
# byte-for-byte (`lossless`).
#
# `imported_types` says which types this module references from each package
# `manifest.yaml`'s `semantic.imports` pins. The FR-035 contract types `imports`
# as package -> exact semver and has no place for a per-package type list
# (agent-ix/quoin#339), so it is declared here, and the suite checks every
# `ImportedTypeRef` against both: the package in the manifest, the type here.
#
# GENERATED by `scripts/build_mappings.py` from `manifest.yaml`, so a column
# list, a locator name, or an id pattern is written once and cannot drift.
# Edit that script, not this file. `make mappings-check` fails on any drift.
mapping_version: 1.0.0
module: agent-ix/spec-artifacts-app
kinds:
- frontmatter
- section
- typed-table
- sysml-fence
- ocl-clause
- provenance
imported_types:
  agent-ix/spec-artifacts-iso:
  - StR
  - US
  - FR
  - NFR
  - IT
  - TC
models:
  ApplicationSpec:
    schema: schemas/ApplicationSpec.json
    artifact_type: ApplicationSpec
    authority: markdown
    round_trip: derived
    dropped_frontmatter_keys:
    - component_type
    - depends_on
    - description
    - implementation_language
    - object
    - okf_version
    - org
    - security_critical
    - standards_alignment
    - tags
    properties:
      id:
        kind: frontmatter
        path:
        - id
        required: true
        lossless: false
      title:
        kind: frontmatter
        path:
        - title
        required: true
        lossless: false
      type:
        kind: frontmatter
        path:
        - type
        required: true
        lossless: false
      status:
        kind: frontmatter
        path:
        - status
        lossless: false
      relationships:
        kind: frontmatter
        path:
        - relationships
        lossless: false
      provenance:
        kind: provenance
        lossless: false
      purpose:
        kind: section
        heading: Purpose
        locator: purpose
        lossless: true
        required: true
      scope:
        kind: section
        heading: Scope
        locator: scope
        lossless: true
      systemOverview:
        kind: section
        heading: System Overview
        locator: system_overview
        lossless: true
      structure:
        kind: section
        heading: Structure
        locator: structure
        lossless: true
      requirementsArchitecture:
        kind: section
        heading: Requirements Architecture
        locator: requirements_architecture
        lossless: true
      references:
        kind: section
        heading: References
        locator: references
        lossless: true
      fields:
        kind: typed-table
        heading: Properties
        locator: properties_table
        columns:
        - Field
        - Type
        - Multiplicity
        - Constraints
        row_model: semantic-core FieldDecl
        cell_parses:
          Field: text
          Type: text
          Multiplicity: multiplicity
          Constraints: constraints
        alternate_form:
          kind: sysml-fence
          heading: Properties
          language: sysml
          locator: properties_fence
        lossless: false
      boundaries:
        kind: typed-table
        heading: Boundaries
        locator: boundaries_table
        columns:
        - ID
        - Name
        - Kind
        - Description
        row_model: Boundary
        id_pattern: ^{id}-BND-\d+$
        cell_parses:
          ID: id
          Name: text
          Kind: enum
          Description: text
        lossless: false
      capabilities:
        kind: typed-table
        heading: Capabilities
        locator: capabilities_table
        columns:
        - ID
        - Name
        - Description
        - Actors
        row_model: Capability
        id_pattern: ^{id}-CAP-\d+$
        cell_parses:
          ID: id
          Name: text
          Description: text
          Actors: id-list
        lossless: false
      actors:
        kind: typed-table
        heading: Actors
        locator: actors_table
        columns:
        - ID
        - Name
        - Kind
        - Description
        row_model: Actor
        id_pattern: ^{id}-ACT-\d+$
        cell_parses:
          ID: id
          Name: text
          Kind: enum
          Description: text
        lossless: false
      interfaces:
        kind: typed-table
