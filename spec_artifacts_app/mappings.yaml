        locator: interfaces_table
        columns:
        - ID
        - Name
        - Kind
        - Direction
        - Contract
        row_model: Interface
        id_pattern: ^{id}-IFC-\d+$
        cell_parses:
          ID: id
          Name: text
          Kind: enum
          Direction: enum
          Contract: text
        lossless: false
      dataDependencies:
        kind: typed-table
        heading: Data Dependencies
        locator: data_dependencies_table
        columns:
        - ID
        - Name
        - Source
        - Access
        row_model: DataDependency
        id_pattern: ^{id}-DAT-\d+$
        cell_parses:
          ID: id
          Name: text
          Source: imported-type-ref
          Access: enum
        lossless: false
      renderingRequirements:
        kind: typed-table
        heading: UI Rendering Requirements
        locator: rendering_requirements_table
        columns:
        - ID
        - Surface
        - Requirement
        - Verification
        row_model: RenderingRequirement
        id_pattern: ^{id}-UI-\d+$
        cell_parses:
          ID: id
          Surface: text
          Requirement: text
          Verification: verification
        lossless: false
      requirements:
        kind: typed-table
        heading: Requirements
        locator: requirements_table
        columns:
        - ID
        - Kind
        - Source
        - Target
        row_model: RequirementRef
        id_pattern: ^(StR|US|FR|NFR|IT|TC)-\d+$
        cell_parses:
          ID: id
          Kind: enum
          Source: imported-type-ref
          Target: text
        lossless: false
      invariants:
        kind: ocl-clause
        heading: Invariants
        locator: invariants
        language: ocl
        lossless: true
